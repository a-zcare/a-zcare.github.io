<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>A-Z Care · Temporary Vote</title><style>:root{color-scheme:dark;--bg:#05080d;--line:#ffffff18;--blue:#5b8cff;--cyan:#62e7ff;--muted:#91a1b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#15335a55,transparent 36%),var(--bg);color:#f5f7fb;font:16px/1.5 Inter,system-ui,sans-serif}main{width:min(720px,92%);margin:auto;padding:48px 0}.brand{font-size:28px;font-weight:800}.brand span{color:var(--blue)}h1{font-size:clamp(34px,8vw,58px);line-height:1;margin:28px 0 12px}p{color:var(--muted)}.poll{margin-top:28px;display:grid;gap:14px}.vote{width:100%;padding:18px 20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#101d2e,#0a111b);color:#fff;text-align:left;cursor:pointer;font-weight:700;font-size:17px}.vote:hover,.vote:focus,.vote.selected{border-color:var(--cyan)}.results{margin-top:28px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#ffffff06}.row{margin:14px 0}.meta{display:flex;justify-content:space-between;gap:12px}.bar{height:10px;margin-top:7px;border-radius:99px;background:#ffffff0d;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}.note{font-size:13px}.reset{margin-top:18px;border:0;background:none;color:#7f91a6;text-decoration:underline;cursor:pointer}</style></head><body><main><div class="brand">A-Z<span>Care</span></div><h1>Quick vote</h1><p>Which direction should A-Z Care prioritize first?</p><div class="poll"><button class="vote" data-id="family">Family & Kids safety</button><button class="vote" data-id="senior">Senior & Care</button><button class="vote" data-id="security">Everyday security & anti-scam</button><button class="vote" data-id="enterprise">Enterprise & organizations</button></div><section class="results"><strong>Results on this device</strong><p class="note">Temporary demo poll. Counts are stored in this browser only.</p><div id="results"></div><button class="reset" id="reset">Reset demo votes</button></section></main><script>const o=[["family","Family & Kids safety"],["senior","Senior & Care"],["security","Everyday security & anti-scam"],["enterprise","Enterprise & organizations"]],k="azcare_temp_poll_v1";let d=JSON.parse(localStorage.getItem(k)||"{}");o.forEach(([i])=>d[i]=Number(d[i]||0));function draw(){let t=Object.values(d).reduce((a,b)=>a+b,0);results.innerHTML=o.map(([i,l])=>{let p=t?Math.round(d[i]*100/t):0;return '<div class="row"><div class="meta"><span>'+l+'</span><b>'+d[i]+' · '+p+'%</b></div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div>'}).join("")+'<p class="note">Total votes: '+t+'</p>'}document.querySelectorAll(".vote").forEach(b=>b.onclick=()=>{d[b.dataset.id]++;localStorage.setItem(k,JSON.stringify(d));b.classList.add("selected");draw()});reset.onclick=()=>{d={family:0,senior:0,security:0,enterprise:0};localStorage.setItem(k,JSON.stringify(d));document.querySelectorAll(".vote").forEach(b=>b.classList.remove("selected"));draw()};draw()</script></body></html>
