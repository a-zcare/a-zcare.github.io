name: Temporary Prettier Format

on:
  push:
    branches:
      - design/ecosystem-home-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/ecosystem-home-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then
            echo "Prettier produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css
          git commit -m "Apply exact Prettier formatting"
          git push
