name: Fix Prettier on feature branch
on:
  push:
    branches:
      - fix/device-lab-android-watch-switches
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write css/device-lab.css docs/PROJECT_AUDIT.md
      - name: Commit formatting only if needed
        run: |
          if ! git diff --quiet -- css/device-lab.css docs/PROJECT_AUDIT.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add css/device-lab.css docs/PROJECT_AUDIT.md
            git commit -m "style: apply Prettier formatting"
            git push
          fi
