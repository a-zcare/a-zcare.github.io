name: Temporary exact Prettier watch fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mobile-product-navigation
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier@3.6.2 --write watch.html
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply exact Prettier formatting to watch page"
          git push origin HEAD:fix/mobile-product-navigation
