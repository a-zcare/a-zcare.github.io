name: Temporary exact test formatter

on:
  push:
    branches:
      - feat/interactive-device-showcase

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/interactive-device-showcase
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier@3.6.2 --write tests/e2e/site.spec.js
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/site.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "Format SOS regression test"
          git push origin HEAD:feat/interactive-device-showcase
