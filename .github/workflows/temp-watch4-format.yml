name: Temporary format
on:
  push:
    branches: [fix/watch-visual-polish]
permissions:
  contents: write
jobs:
  format:
    if: github.event.head_commit.message != 'Apply Prettier formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: fix/watch-visual-polish }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx prettier --write index.html
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Prettier formatting"
          git push origin HEAD:fix/watch-visual-polish
