<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A-Z Care — Голосование</title><style>*{box-sizing:border-box}body{margin:0;background:#05080d;color:#f5f7fb;font-family:Inter,system-ui,sans-serif}.wrap{width:min(760px,92%);margin:auto;padding:45px 0}.brand{font-size:26px;font-weight:800;margin-bottom:35px}.brand span{color:#5b8cff}.card{padding:26px;border:1px solid #ffffff18;border-radius:22px;background:#0b111b}h1{font-size:clamp(30px,7vw,50px);line-height:1.05;margin:0 0 12px}p{color:#91a1b5}.options{display:grid;gap:14px;margin:28px 0 20px}.vote{padding:18px;border:1px solid #ffffff1c;border-radius:15px;background:#ffffff08;color:#fff;text-align:left;font-weight:700;font-size:16px}.vote.selected{border-color:#62e7ff;background:#62e7ff15}.submit{padding:14px 20px;border:0;border-radius:12px;background:linear-gradient(135deg,#5b8cff,#735cff);color:white;font-weight:800}.status{min-height:25px;margin-top:14px}.results{border-top:1px solid #ffffff14;margin-top:20px;padding-top:20px}.r{margin:15px 0}.rh{display:flex;justify-content:space-between;font-size:13px}.bar{height:10px;background:#ffffff0b;border-radius:99px;overflow:hidden;margin-top:7px}.fill{height:100%;background:linear-gradient(90deg,#5b8cff,#62e7ff)}</style></head><body><main class="wrap"><div class="brand">A-Z<span>Care</span></div><section class="card"><p style="color:#62e7ff;font-weight:800">TEMPORARY VOTE</p><h1>Какой режим A-Z Care вам интереснее?</h1><p>Выберите один вариант и нажмите «Проголосовать».</p><div class="options"><button class="vote" data-c="Kids Mode">Kids Mode — безопасность ребёнка</button><button class="vote" data-c="Everyday">Everyday — смартфон для всех</button><button class="vote" data-c="Senior & Care">Senior & Care — пожилые и уход</button><button class="vote" data-c="Enterprise">Enterprise — компании и организации</button></div><button class="submit">Проголосовать</button><div class="status"></div><div class="results"><b>Результаты на этом устройстве</b><div id="res"></div></div><p style="font-size:12px">Временная тестовая страница. Сейчас счётчик хранится локально в браузере, не на общем сервере.</p></section></main><script>const cs=['Kids Mode','Everyday','Senior & Care','Enterprise'],k='azcare_vote_v1';let s='';const g=()=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}};function r(){const v=g(),t=cs.reduce((a,c)=>a+(v[c]||0),0);res.innerHTML=cs.map(c=>{let n=v[c]||0,p=t?Math.round(n/t*100):0;return '<div class="r"><div class="rh"><span>'+c+'</span><b>'+n+' · '+p+'%</b></div><div class="bar"><div class="fill" style="width:'+p+'%"></div></div></div>'}).join('')}document.querySelectorAll('.vote').forEach(b=>b.onclick=()=>{s=b.dataset.c;document.querySelectorAll('.vote').forEach(x=>x.classList.toggle('selected',x===b))});document.querySelector('.submit').onclick=()=>{if(!s){document.querySelector('.status').textContent='Сначала выберите вариант.';return}let v=g();v[s]=(v[s]||0)+1;localStorage.setItem(k,JSON.stringify(v));document.querySelector('.status').textContent='Голос учтён.';r()};r()</script></body></html>
